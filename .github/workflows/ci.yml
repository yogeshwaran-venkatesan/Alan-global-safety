name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Unit tests in headless Chrome (catalogue integrity, translations, quote list, forms).
      - run: npm run test:ci

      # Prerenders all 61 pages; fails if any page throws while rendering.
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/alan-global-safety/browser
          retention-days: 7
